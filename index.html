<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Compras</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="pt-10 flex flex-col justify-center items-center mx-auto w-full">
      <h1 class="text-2xl font-bold">Lista de Compras</h1>
      <form id="item-form">
        <div class="input-group pt-5 font-semibold text-sm">
          <label for="descricao">Descrição do Item:</label>
          <input class="input" type="text" id="descricao" required />
        </div>
        <div class="input-group font-semibold text-sm">
          <label for="preco">Preço:</label>
          <input
            class="input"
            type="number"
            id="preco"
            step="0.01"
            inputmode="decimal"
            pattern="[0-9]*[.,]?[0-9]+"
            required
          />
        </div>
        <div class="input-group font-semibold text-sm">
          <label for="quantidade">Quantidade:</label>
          <input
            class="input"
            type="number"
            id="quantidade"
            inputmode="decimal"
            pattern="[0-9]*[.,]?[0-9]+"
            required
          />
        </div>
        <div class="pt-5">
          <button
            class="text-[#fff] bg-[#000] w-full cartBtn p-1 text-sm"
            type="submit"
          >
            <svg
              class="cart"
              fill="white"
              viewBox="0 0 576 512"
              height="1em"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M0 24C0 10.7 10.7 0 24 0H69.5c22 0 41.5 12.8 50.6 32h411c26.3 0 45.5 25 38.6 50.4l-41 152.3c-8.5 31.4-37 53.3-69.5 53.3H170.7l5.4 28.5c2.2 11.3 12.1 19.5 23.6 19.5H488c13.3 0 24 10.7 24 24s-10.7 24-24 24H199.7c-34.6 0-64.3-24.6-70.7-58.5L77.4 54.5c-.7-3.8-4-6.5-7.9-6.5H24C10.7 48 0 37.3 0 24zM128 464a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm336-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"
              ></path>
            </svg>
            Adicionar ao carrinho
          </button>
        </div>
      </form>
    </div>

    <div
      class="lista p-4 flex flex-col gap-7 justify-center items-center mx-auto w-full"
    >
      <h2 class="font-semibold text-sm">Itens Adicionados:</h2>
      <ul class="text-sm" id="itens"></ul>
      <div class="">
        <p id="total">Total: R$ 0.00</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</html>
